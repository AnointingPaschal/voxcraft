name = "voicera"
pages_build_output_dir = "dist"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# No secrets needed here — set them in the Admin panel after first login
# The only required Pages env var is:
#   VITE_API_BASE = (leave blank — functions are same-origin, no base URL needed)
